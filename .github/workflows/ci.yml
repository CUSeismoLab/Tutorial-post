name: Build check

# Build every pull request (including Dependabot's) so a broken dependency
# update fails here instead of breaking the GitHub Pages deploy on main.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Same base path as deploy.yml, so verify checks the links Pages will serve.
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
      BASE_PATH: ${{ vars.BASE_PATH || (vars.SITE_URL != '' && '/') || (endsWith(github.event.repository.name, '.github.io') && '/') || format('/{0}', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Build site
        run: npm run build
      - name: Verify local links and migrated pages
        run: npm run verify
